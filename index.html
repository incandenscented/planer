<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Планировщик квартиры</title>
</head>
<body>
    <h1>Планировщик квартиры</h1>
    <p>Перетаскивайте мебель мышкой внутри комнаты</p>

    <div class="app">
        <div class="toolbox">
            <h3>Мебель</h3>
            <button class="tool-btn" data-type="sofa">🛋 Диван (2×1 м)</button>
            <button class="tool-btn" data-type="table">🪑 Стол (1×1 м)</button>
            <button class="tool-btn" data-type="wardrobe">🚪 Шкаф (1×0.5 м)</button>
            <button class="tool-btn" data-type="bed">🛏 Кровать (2×1.5 м)</button>
            <hr>
            <button id="clear-btn">🗑 Очистить</button>
        </div>
        <div class="room-wrapper">
            <div id="room" class="room"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
