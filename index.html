<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Планировщик квартиры — архитектурный инструмент</title>
</head>
<body>

    <header class="topbar">
        <div class="brand">
            <span class="brand-icon">🏛</span>
            <span class="brand-name">Планировщик квартиры</span>
        </div>
        <div class="topbar-actions">
            <div class="visits-badge">
                👣 <span id="visits-count">1</span>
            </div>
        </div>
    </header>

    <div class="app">

        <aside class="toolbox">

            <section class="panel">
                <h3>📐 Комната</h3>
                <label>Ширина (м): <input id="room-w" type="number" value="6" min="2" max="10" step="0.5"></label>
                <label>Длина (м):  <input id="room-h" type="number" value="5" min="2" max="10" step="0.5"></label>
                <button id="apply-room" class="btn-primary">Применить</button>
            </section>

            <section class="panel">
                <h3>🚪 Проёмы</h3>
                <p class="panel-hint">Кликните инструмент, затем по стене</p>
                <div class="btn-grid">
                    <button class="tool-btn door" data-mode="door">🚪 Дверь</button>
                    <button class="tool-btn window" data-mode="window">🪟 Окно</button>
                </div>
                <label>Ширина (м): <input id="opening-width" type="number" value="0.9" min="0.6" max="2.5" step="0.1"></label>
            </section>

            <section class="panel">
                <h3>➕ Своя мебель</h3>
                <input id="f-name" type="text" placeholder="Название" maxlength="14">
                <label>Форма:
                    <select id="f-shape">
                        <option value="rect">Прямоугольник</option>
                        <option value="rounded">Скругление</option>
                        <option value="round">Круг</option>
                        <option value="oval">Овал</option>
                    </select>
                </label>
                <label>Ширина (м): <input id="f-w" type="number" value="1" min="0.5" max="5" step="0.5"></label>
                <label>Глубина (м): <input id="f-h" type="number" value="1" min="0.5" max="5" step="0.5"></label>
                <button id="add-custom" class="btn-primary">Добавить</button>
            </section>

            <section class="panel">
                <h3>💾 Действия</h3>
                <button id="save-png" class="btn-save">📸 Сохранить PNG</button>
                <button id="clear-btn" class="btn-danger">🗑 Очистить всё</button>
            </section>

        </aside>

        <main class="viewport">
            <div id="room" class="room"></div>
        </main>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
